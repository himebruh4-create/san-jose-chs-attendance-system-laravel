# San Jose CHS Attendance System (Laravel) — LAN site.
# Included from httpd.conf. Remove the Include line there to disable.

# Only Laravel's public/ folder may ever be served. The project folder also
# sits inside htdocs, where the default site would otherwise expose .env
# (database password, app key), logs and backups.
<Directory "C:/xampp/htdocs/san-jose-chs-attendance-system-laravel">
    Require all denied
</Directory>

<Directory "C:/xampp/htdocs/san-jose-chs-attendance-system-laravel/public">
    AllowOverride All
    Options -Indexes +FollowSymLinks
    Require all granted
</Directory>

# Its own port so it does not interfere with the other sites on 80/443.
Listen 8088

<VirtualHost *:8088>
    ServerName sjchs-attendance
    DocumentRoot "C:/xampp/htdocs/san-jose-chs-attendance-system-laravel/public"

    ErrorLog "logs/sjchs-error.log"
    CustomLog "logs/sjchs-access.log" common
</VirtualHost>

# HTTPS — needed for the kiosk webcam on any device other than the server
# itself (browsers only allow the camera on https:// or http://localhost).
# deploy/make-ssl-cert.ps1 makes the certificate below for the server's IPs /
# name, signed by a local CA that every kiosk device trusts once. Change 8443
# to 443 on a dedicated server.
Listen 8443

<VirtualHost *:8443>
    ServerName sjchs-attendance
    DocumentRoot "C:/xampp/htdocs/san-jose-chs-attendance-system-laravel/public"

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "C:/xampp/apache/conf/sjchs-ssl/server.crt"
    SSLCertificateKeyFile "C:/xampp/apache/conf/sjchs-ssl/server.key"

    ErrorLog "logs/sjchs-ssl-error.log"
    CustomLog "logs/sjchs-ssl-access.log" common
</VirtualHost>
